version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yojanasetu_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./yojanasetu.db
      - VECTOR_STORE=local
      - EMBEDDING_PROVIDER=local
      - RERANKER_PROVIDER=local
      - LLM_PROVIDER=mock
    volumes:
      - ./data:/app/data
      - ./yojanasetu.db:/app/yojanasetu.db
    restart: unless-stopped
